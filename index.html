<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhakundo (भाकुण्डो) 🇳🇵 | Real-Time Live Football Scores & Data (Ad-Free)</title>
    <meta
      name="description"
      content="Bhakundo (भाकुण्डो) - 100% Ad-Free real-time football scores, live commentary, formations, match stats, head-to-head records, and standings for Nepal Super League, Premier League, and world football."
    />
    <meta name="theme-color" content="#DC143C" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bhakundo_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#070b12] text-slate-800 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
